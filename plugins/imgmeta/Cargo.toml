[package]
name = "osnt-imgmeta"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
kamadak-exif = "0.6"
sha2 = "0.10"
imagesize = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
