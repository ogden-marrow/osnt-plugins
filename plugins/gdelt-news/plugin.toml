id = "gdelt-news"
name = "Global news monitor (GDELT)"
description = "Search worldwide news coverage with volume and tone timelines, the latest GDELT export files, and saved stories that flag volume spikes."
grid = "Events & News"
port = 8149
version = "0.1.0"

[service]
state_dir = true

[service.env]
OSNT_GDELT_BIND = "127.0.0.1:{port}"
OSNT_GDELT_DB = "{state_dir}/gdelt.redb"
