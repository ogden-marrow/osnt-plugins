[package]
name = "osnt-provenance"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
sha2 = "0.10"
imagesize = "0.13"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }
rustls-rustcrypto = "0.0.2-alpha"
osnt-common = { path = "../../sdk" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
