id = "provenance"
name = "Image source finder"
description = "Agentic search for the likely original source of an image: reverse-image search, page dates and Wayback, with honest confidence and caveats."
grid = "Media & Verification"
port = 8106
version = "0.3.0"

[service]
state_dir = false

[service.env]
OSNT_PROVENANCE_BIND = "127.0.0.1:{port}"

# The reasoning loop works with any OpenAI-compatible chat-completions API, and with Anthropic and Gemini natively.
# Set LLM_BASE_URL and LLM_MODEL (and LLM_API_KEY; local servers need none). LLM_API_STYLE is "openai" (default), "anthropic" or "gemini":
#   DeepSeek:   https://api.deepseek.com                      deepseek-chat
#   OpenAI:     https://api.openai.com/v1                     gpt-4o-mini
#   OpenRouter: https://openrouter.ai/api/v1                  <any model id>
#   Anthropic:  https://api.anthropic.com/v1                  claude-sonnet-4-5   (style: anthropic)
#   Gemini:     https://generativelanguage.googleapis.com/v1beta  gemini-2.5-flash   (style: gemini)
#   Ollama:     http://127.0.0.1:11434/v1                     <your model>   (no key)
[[secret]]
name = "LLM_BASE_URL"
label = "LLM API base URL (OpenAI-compatible)"
required = true

[[secret]]
name = "LLM_MODEL"
label = "LLM model name"
required = true

[[secret]]
name = "LLM_API_STYLE"
label = "LLM API style: openai (default), anthropic or gemini"
required = false

[[secret]]
name = "LLM_API_KEY"
label = "LLM API key (leave empty for local servers)"
required = false

[[secret]]
name = "GOOGLE_VISION_API_KEY"
label = "Google Cloud Vision API key (web detection)"
help_url = "https://console.cloud.google.com/apis/library/vision.googleapis.com"
required = false

[[secret]]
name = "SERPAPI_API_KEY"
label = "SerpAPI key (Google Lens matches)"
help_url = "https://serpapi.com/manage-api-key"
required = false
