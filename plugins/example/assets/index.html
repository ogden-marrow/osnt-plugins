<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Example</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { padding: 8px 16px; border-bottom: 1px solid #243040; }
    header a { color: inherit; text-decoration: none; letter-spacing: .08em; font-size: 16px; }
    main { padding: 24px; }
  </style>
</head>
<body>
  <header><a href="/">&larr; OSNT</a> / EXAMPLE</header>
  <main id="out">loading…</main>
  <script>
    // Use RELATIVE urls: the core mounts this page at /p/<id>/. Shared assets are absolute: /static/osnt-map.js, /static/leaflet/*.
    fetch('api/hello').then(r => r.json()).then(d => document.getElementById('out').textContent = d.message);
  </script>
</body>
</html>
