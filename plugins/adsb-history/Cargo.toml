[package]
name = "osnt-adsb-history"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pure-Rust inflate (miniz_oxide backend), no C zlib.
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }
rustls-rustcrypto = "0.0.2-alpha"
osnt-common = { path = "../../sdk" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
