<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Packages</title>
  <base target="_top">
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --panel:#151c24; --line:#243040; --line2:#2d3a4a; --text:#e6e6e6; --dim:#9fb0c0; --faint:#7f93a8; --ok:#3fae91; --warn:#ffd54f; --bad:#ef6c6c; --link:#6fc3ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; }
    h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 28px 0 8px; font-weight: 600; }
    a { color: var(--link); }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; min-width: 160px; }
    input[type=search], input[type=text] { width: 100%; padding: 10px 12px; background: var(--bg); color: inherit; border: 1px solid var(--line2); border-radius: 8px; font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    button { background: var(--panel); color: inherit; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 14px; cursor: pointer; font: inherit; min-height: 40px; }
    button:hover:not(:disabled) { border-color: var(--ok); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: #1d3a34; border-color: #2f6f5e; }
    button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
    button.ghost { background: transparent; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { padding: 6px 12px; border-radius: 999px; font-size: 13px; min-height: 0; }
    .chip[aria-pressed=true] { background: #1d3a34; border-color: #2f6f5e; }
    .card { margin-top: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .card.busy { border-color: var(--ok); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .name { font-size: 15px; font-weight: 600; }
    .ver { color: var(--faint); font-size: 12px; margin-left: 6px; font-weight: 400; }
    .desc { margin: 4px 0 0; font-size: 13px; color: var(--dim); line-height: 1.45; }
    .badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line2); color: var(--faint); white-space: nowrap; vertical-align: middle; margin-left: 6px; }
    .badge.installed { color: var(--ok); border-color: #2f6f5e; } .badge.update { color: var(--warn); border-color: #6f5e2f; } .badge.core { color: var(--link); border-color: #2f4f6f; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--faint); align-items: center; }
    .tag { border: 1px solid var(--line2); border-radius: 6px; padding: 1px 7px; }
    .tag.bad { color: var(--bad); border-color: #6f2f2f; }
    .status { margin-top: 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
    .status.ok { color: var(--ok); } .status.err { color: var(--bad); }
    .spin { width: 14px; height: 14px; border: 2px solid var(--line2); border-top-color: var(--ok); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
    .muted { color: var(--faint); font-size: 13px; } .err { color: var(--bad); }
    .empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--line2); border-radius: 10px; color: var(--dim); }
    .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
    .repo { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .repo .url { word-break: break-all; font-size: 14px; }
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(5, 8, 12, .7); }
    dialog form { padding: 20px; } dialog h3 { margin: 0 0 4px; font-size: 17px; }
    dialog ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--dim); line-height: 1.6; }
    dialog .row { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
    dialog label.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--dim); }
    code { font: 12px ui-monospace, monospace; background: #0b0f14; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="bar">
      <div class="grow"><input type="search" id="q" placeholder="Search packages" aria-label="Search packages"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="installed" aria-pressed="false">Installed</button>
        <button class="chip" data-f="available" aria-pressed="false">Not installed</button>
        <button class="chip" data-f="update" aria-pressed="false">Updates</button>
      </div>
      <button id="refresh" class="ghost" title="Check the repositories again">Refresh</button>
    </div>
    <div id="banner"></div>
    <div id="pkgs" aria-live="polite"><p class="muted">Loading&hellip;</p></div>

    <h2>Repositories</h2>
    <div id="repos"></div>
    <form id="addForm" class="bar" style="margin-top:10px"><div class="grow"><input type="text" id="url" placeholder="https://github.com/owner/repo" aria-label="GitHub repository link" autocomplete="off"></div><button class="primary">Add repository</button></form>
    <p class="muted err" id="msg" role="alert"></p>

    <h2>GitHub</h2>
    <div class="card" id="gh"><p class="muted">Checking&hellip;</p></div>
  </main>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const call = (method, path, body) => fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) });
    const LABEL = { installed: 'installed', update: 'update available', available: 'not installed' };
    let data = { packages: [], other_installed: [], repos: [], github: false };
    let filter = 'all', query = '', working = false;
    const progress = {}; // plugin id -> { text, state } shown on its card while a job runs or after it ends

    async function load(fresh = false) {
      const r = await call('GET', 'api/packages' + (fresh ? '?fresh=1' : ''));
      if (r.status === 401) { top.location.href = '/login?next=/settings%23packages'; return; }
      data = await r.json();
      render();
    }

    function render() {
      renderRepos();
      const updates = data.packages.filter(p => p.status === 'update' && p.installable);
      $('banner').innerHTML = '';
      if (updates.length && !working) {
        const b = document.createElement('div'); b.className = 'card';
        b.innerHTML = `<div class="top"><div><b>${updates.length} update${updates.length > 1 ? 's' : ''} available</b><p class="desc">${updates.map(p => esc(p.name)).join(', ')}</p></div><div class="actions"><button class="primary">Update all</button></div></div>`;
        b.querySelector('button').onclick = () => updateAll(updates);
        $('banner').append(b);
      }
      const all = [...data.packages, ...data.other_installed.map(o => ({ ...o, status: 'installed', installed_version: o.version, local: true, description: 'Installed from outside your repositories.', requires: [], missing_requires: [] }))];
      const list = all.filter(p => (filter === 'all' || p.status === filter) && (!query || (p.name + ' ' + p.id + ' ' + (p.description || '')).toLowerCase().includes(query)));
      const box = $('pkgs'); box.innerHTML = '';
      if (!data.repos.length) {
        box.innerHTML = '<div class="empty"><b>Add a package repository to get started</b>Paste a GitHub link in the box under Repositories. Your own plugins repository works once GitHub is connected.</div>';
        return;
      }
      if (!list.length) box.innerHTML = `<div class="empty"><b>${all.length ? 'No packages match' : 'Nothing here yet'}</b>${all.length ? 'Try another filter or search.' : 'The repositories above did not list any packages.'}</div>`;
      for (const p of list) box.append(card(p));
    }

    function card(p) {
      const el = document.createElement('div'); el.className = 'card'; el.id = 'pkg-' + p.id;
      const prog = progress[p.id];
      const ver = p.installed_version ? (p.status === 'update' && p.version ? `${esc(p.installed_version)} &rarr; ${esc(p.version)}` : esc(p.installed_version)) : esc(p.version);
      const blocked = !!(p.missing_requires && p.missing_requires.some(r => !data.packages.some(x => x.id === r && x.installable)));
      el.innerHTML = `<div class="top"><div style="flex:1;min-width:200px"><span class="name">${esc(p.name)}</span><span class="ver">${ver}</span>
          <span class="badge ${p.status}">${LABEL[p.status]}</span>${p.core ? '<span class="badge core">core</span>' : ''}
          <p class="desc">${esc(p.description)}</p></div><div class="actions"></div></div><div class="meta"></div>`;
      const act = el.querySelector('.actions'), meta = el.querySelector('.meta');
      const add = (label, cls, fn, disabled, title) => { const b = document.createElement('button'); b.textContent = label; b.className = cls || ''; b.disabled = working || !!disabled; if (title) b.title = title; b.onclick = fn; act.append(b); };
      if (p.status === 'available') add('Install', 'primary', () => confirmInstall(p), !p.installable || blocked, !p.installable ? 'No build has been published yet' : blocked ? 'A required package is not available' : '');
      if (p.status === 'update') add('Update', 'primary', () => confirmInstall(p), !p.installable, !p.installable ? 'No build has been published yet' : '');
      if (p.status !== 'available' && !p.core) add('Uninstall', 'danger', () => confirmRemove(p), p.dependents && p.dependents.length, p.dependents && p.dependents.length ? 'Remove ' + p.dependents.join(', ') + ' first' : '');
      if (p.status !== 'available') { const a = document.createElement('a'); a.href = '/p/' + p.id + '/'; a.textContent = 'Open'; a.style.fontSize = '14px'; act.prepend(a); }
      if (p.requires && p.requires.length) meta.insertAdjacentHTML('beforeend', 'Needs ' + p.requires.map(r => `<span class="tag ${p.missing_requires.includes(r) ? 'bad' : ''}">${esc(r)}</span>`).join(''));
      if (p.dependents && p.dependents.length) meta.insertAdjacentHTML('beforeend', 'Used by ' + p.dependents.map(r => `<span class="tag">${esc(r)}</span>`).join(''));
      if (!p.local && !p.installable) meta.insertAdjacentHTML('beforeend', '<span class="tag">No build published yet. Run the repository&rsquo;s release workflow (Actions tab).</span>');
      if (prog) {
        el.classList.toggle('busy', prog.state === 'running');
        const s = document.createElement('div'); s.className = 'status ' + (prog.state === 'done' ? 'ok' : prog.state === 'failed' ? 'err' : '');
        s.setAttribute('role', prog.state === 'failed' ? 'alert' : 'status');
        s.innerHTML = (prog.state === 'running' ? '<span class="spin"></span>' : '') + `<span>${esc(prog.text)}</span>` + (prog.keys ? ' <a href="/settings#credentials">Add API keys</a>' : '');
        el.append(s);
      }
      return el;
    }

    // ---- confirmation dialogs ----
    function ask(html, okLabel, okClass) {
      return new Promise(res => {
        const dlg = $('dlg'), form = $('dlgForm');
        form.innerHTML = html + `<div class="row"><button type="button" value="no" class="ghost">Cancel</button><button type="submit" class="${okClass || 'primary'}" value="yes">${okLabel}</button></div>`;
        form.querySelector('[value=no]').onclick = () => dlg.close('no');
        dlg.onclose = () => res(dlg.returnValue === 'yes' ? { purge: !!form.querySelector('#purge')?.checked } : null);
        dlg.returnValue = 'no'; dlg.showModal();
      });
    }

    async function confirmInstall(p) {
      const dep = (p.missing_requires || []).map(r => data.packages.find(x => x.id === r)).filter(Boolean);
      let d = {};
      try { const r = await call('GET', 'api/details?repo=' + encodeURIComponent(p.repo) + '&id=' + encodeURIComponent(p.id)); if (r.ok) d = await r.json(); } catch {}
      const secrets = (d.secrets || []).map(s => `<li>${esc(s.label || s.name)} <code>${esc(s.name)}</code>${s.required ? ' (required)' : ''}</li>`).join('');
      const ok = await ask(`<h3>${p.status === 'update' ? 'Update' : 'Install'} ${esc(p.name)}</h3><p class="desc">${esc(p.description)}</p><ul>
          <li>Runs as a sandboxed service on this Pi, with network access.</li>
          <li>${d.stores_data ? 'Keeps its own data on the Pi.' : 'Keeps no data of its own.'}</li>
          ${dep.length ? `<li>Also installs the packages it needs: <b>${dep.map(x => esc(x.name)).join(', ')}</b>.</li>` : ''}
          ${secrets ? `<li>Can read these credentials once you add them:<ul>${secrets}</ul></li>` : '<li>Asks for no credentials.</li>'}
        </ul><p class="muted" style="margin-top:12px">Only install packages from repositories you trust: they run code on your Pi.</p>`, p.status === 'update' ? 'Update' : 'Install');
      if (ok) run([...dep, p].map(x => ({ kind: 'install', pkg: x })));
    }

    async function confirmRemove(p) {
      const ok = await ask(`<h3>Uninstall ${esc(p.name)}?</h3><p class="desc">The service stops and disappears from the launcher. Credentials you saved stay in your key store.</p>
        <label class="check"><input type="checkbox" id="purge"> Also delete the data it stored on the Pi</label>`, 'Uninstall', 'danger');
      if (ok) run([{ kind: 'remove', pkg: p, purge: ok.purge }]);
    }

    function updateAll(list) { run(list.map(p => ({ kind: 'install', pkg: p }))); }

    // ---- running jobs ----
    async function runJob(step) {
      const { kind, pkg } = step;
      const set = (text, state, keys) => { progress[pkg.id] = { text, state, keys }; render(); };
      set(kind === 'install' ? 'Starting' : 'Removing', 'running');
      const r = await call('POST', kind === 'install' ? 'api/install' : 'api/remove', kind === 'install' ? { repo: pkg.repo, id: pkg.id } : { id: pkg.id, purge: !!step.purge });
      const j = await r.json();
      if (!r.ok) { set(j.error || 'Could not start', 'failed'); return false; }
      const started = Date.now();
      for (;;) {
        await new Promise(res => setTimeout(res, 1000));
        let s;
        try { s = await (await call('GET', 'api/jobs/' + j.job)).json(); } catch { continue; }
        if (s.state === 'done') { set(s.message, 'done', kind === 'install' && /asks for/i.test(s.message)); return true; }
        if (s.state === 'failed') { set(s.message, 'failed'); return false; }
        const waiting = s.state === 'queued' && Date.now() - started > 20000;
        set(waiting ? 'The installer service has not picked this up. Is osnt-helper running on the Pi?' : s.message, waiting ? 'failed' : 'running');
        if (waiting) return false;
        if (Date.now() - started > 600000) { set('Timed out waiting for the installer', 'failed'); return false; }
      }
    }

    async function run(steps) {
      working = true; render();
      for (const s of steps) { if (!(await runJob(s))) break; }
      working = false;
      await load(true);
    }

    // ---- repositories ----
    function renderRepos() {
      const box = $('repos'); box.innerHTML = '';
      if (!data.repos.length) box.innerHTML = '<p class="muted">No repositories yet.</p>';
      for (const repo of data.repos) {
        const el = document.createElement('div'); el.className = 'card repo';
        el.innerHTML = `<div><div class="url">${esc(repo.url.replace('https://github.com/', ''))}</div><div class="${repo.ok ? 'muted' : 'err'}" style="font-size:13px">${repo.ok ? `${esc(repo.count)} packages${repo.published ? '' : ' &middot; no published build yet'}` : esc(repo.error)}</div></div><button class="danger ghost">Remove</button>`;
        el.querySelector('button').onclick = async () => { await call('DELETE', 'api/repos?url=' + encodeURIComponent(repo.url)); load(true); };
        box.append(el);
      }
    }

    $('addForm').onsubmit = async e => {
      e.preventDefault();
      const res = await call('POST', 'api/repos', { url: $('url').value });
      $('msg').textContent = res.ok ? '' : (await res.json()).error;
      if (res.ok) { $('url').value = ''; await load(true); }
    };
    $('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
    $('chips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b))); render(); };
    $('refresh').onclick = async e => { e.target.disabled = true; await load(true); e.target.disabled = false; };

    // ---- GitHub connection (device flow) ----
    let polling = false;
    async function ghStatus() {
      const d = await (await call('GET', 'api/github')).json();
      const box = $('gh');
      if (d.connected) {
        box.innerHTML = `<div class="repo"><div><b>Connected as ${esc(d.login)}</b><div class="muted">Private repositories where the OSNT GitHub App is installed can be read.</div></div><button class="danger ghost">Disconnect</button></div>`;
        box.querySelector('button').onclick = async () => { await call('DELETE', 'api/github'); ghStatus(); load(true); };
      } else if (!polling) {
        box.innerHTML = `<div class="repo"><div><b>Not connected</b><div class="muted">${d.stored ? 'The saved sign-in has expired. ' : ''}Needed only for private repositories.</div></div><button class="primary">Connect GitHub</button></div><p class="err" id="ghErr" role="alert"></p>`;
        box.querySelector('button').onclick = ghConnect;
      }
    }
    async function ghConnect() {
      const r = await call('POST', 'api/github/start'); const d = await r.json();
      if (!r.ok) { $('ghErr').textContent = d.error; return; }
      polling = true;
      $('gh').innerHTML = `<b>Enter this code on GitHub</b><p style="font-size:28px;letter-spacing:.2em;margin:8px 0"><code>${esc(d.user_code)}</code></p>
        <p class="muted">Open <a href="${esc(d.verification_uri)}" target="_blank" rel="noopener noreferrer">${esc(d.verification_uri)}</a> on any device, type the code and approve. This page continues by itself.</p>`;
      let wait = Math.max(5, d.interval || 5); const deadline = Date.now() + (d.expires_in || 900) * 1000;
      while (Date.now() < deadline) {
        await new Promise(res => setTimeout(res, wait * 1000));
        const p = await call('POST', 'api/github/poll'); const j = await p.json();
        if (!p.ok || j.status === 'failed') { polling = false; await ghStatus(); $('ghErr').textContent = j.error || ''; return; }
        if (j.status === 'connected') break;
        if (j.slow_down) wait += 5;
      }
      polling = false; await ghStatus(); load(true);
    }

    ghStatus(); load();
  </script>
</body>
</html>
