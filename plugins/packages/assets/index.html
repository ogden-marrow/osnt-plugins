<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Packages</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #243040; font-size: 16px; letter-spacing: .08em; }
    header a { color: inherit; text-decoration: none; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #8aa; margin: 22px 0 6px; }
    .card { margin-top: 10px; padding: 12px 14px; border: 1px solid #243040; border-radius: 8px; background: #151c24; }
    .card h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .card p { margin: 0 0 8px; font-size: 12px; color: #9fb0c0; }
    .badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; border: 1px solid #2d3a4a; color: #7f93a8; white-space: nowrap; }
    .badge.installed { color: #3fae91; border-color: #2f6f5e; } .badge.update { color: #ffd54f; border-color: #6f5e2f; }
    .row { display: flex; gap: 6px; align-items: center; }
    input { flex: 1; padding: 7px 9px; background: #0f1419; color: inherit; border: 1px solid #2d3a4a; border-radius: 6px; }
    button { background: #151c24; color: inherit; border: 1px solid #2d3a4a; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: #3fae91; } button.danger:hover { border-color: #c0392b; }
    code { font: 12px ui-monospace, monospace; background: #0b0f14; padding: 4px 6px; border-radius: 4px; word-break: break-all; flex: 1; }
    .err { color: #ef6c6c; } .muted { color: #8aa; font-size: 13px; }
  </style>
</head>
<body>
  <header><span><a href="/">&larr; OSNT</a> / PACKAGES</span></header>
  <main>
    <h2>GitHub</h2>
    <div class="card" id="gh"><p class="muted">Checking&hellip;</p></div>
    <h2>Repositories</h2>
    <div id="repos"></div>
    <form id="addForm" class="row" style="margin-top:10px"><input id="url" placeholder="https://github.com/owner/repo"><button>Add repository</button></form>
    <p class="muted" id="msg"></p>
    <h2>Packages</h2>
    <p class="muted">Installing and removing is done from your computer for now: copy the command shown on a package and run it in the hub's folder.</p>
    <div id="pkgs"><p class="muted">Loading&hellip;</p></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const call = (method, path, body) => fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) });
    const LABEL = { installed: 'installed', update: 'update available', available: 'not installed' };

    function cmdRow(cmd, cls = '') {
      const el = document.createElement('div'); el.className = 'row';
      el.innerHTML = `<code>${esc(cmd)}</code><button type="button" class="${cls}">Copy</button>`;
      el.querySelector('button').onclick = async e => {
        try { await navigator.clipboard.writeText(cmd); e.target.textContent = 'Copied'; } catch { e.target.textContent = 'Select and copy'; }
        setTimeout(() => e.target.textContent = 'Copy', 1500);
      };
      return el;
    }

    let polling = false;
    async function ghStatus() {
      const d = await (await call('GET', 'api/github')).json();
      const box = $('gh');
      if (d.connected) {
        box.innerHTML = `<h3><span>Connected as <b>${esc(d.login)}</b></span><button type="button" class="danger">Disconnect</button></h3><p>Private repositories where the OSNT GitHub App is installed can be read.</p>`;
        box.querySelector('button').onclick = async () => { await call('DELETE', 'api/github'); ghStatus(); load(); };
      } else if (!polling) {
        box.innerHTML = `<h3><span>Not connected</span><button type="button">Connect GitHub</button></h3><p>${d.stored ? 'The saved sign-in has expired. ' : ''}Needed only for private repositories.</p><p class="err" id="ghErr"></p>`;
        box.querySelector('button').onclick = ghConnect;
      }
    }
    async function ghConnect() {
      const r = await call('POST', 'api/github/start');
      const d = await r.json();
      if (!r.ok) { $('ghErr').textContent = d.error; return; }
      polling = true;
      $('gh').innerHTML = `<h3><span>Enter this code on GitHub</span></h3>
        <p style="font-size:26px;letter-spacing:.2em;color:#e6e6e6;margin:8px 0"><code>${esc(d.user_code)}</code></p>
        <p>Open <a href="${esc(d.verification_uri)}" target="_blank" rel="noopener noreferrer">${esc(d.verification_uri)}</a> on any device, type the code and approve. This page continues by itself.</p>`;
      let wait = Math.max(5, d.interval || 5);
      const deadline = Date.now() + (d.expires_in || 900) * 1000;
      while (Date.now() < deadline) {
        await new Promise(res => setTimeout(res, wait * 1000));
        const p = await call('POST', 'api/github/poll');
        const j = await p.json();
        if (!p.ok) { polling = false; await ghStatus(); $('ghErr').textContent = j.error; return; }
        if (j.status === 'connected') break;
        if (j.status === 'failed') { polling = false; await ghStatus(); $('ghErr').textContent = j.error; return; }
        if (j.slow_down) wait += 5;
      }
      polling = false; await ghStatus(); load();
    }

    async function load() {
      const r = await call('GET', 'api/packages');
      if (r.status === 401) { location.href = '/login?next=/p/packages/'; return; }
      const d = await r.json();
      $('repos').innerHTML = d.repos.length ? '' : '<p class="muted">No repositories yet. Add one below.</p>';
      for (const repo of d.repos) {
        const el = document.createElement('div'); el.className = 'card';
        el.innerHTML = `<h3><span>${esc(repo.url)}</span><button type="button" class="danger">Remove</button></h3>
          <p class="${repo.ok ? '' : 'err'}">${repo.ok ? esc(repo.count) + ' packages' : esc(repo.error)}</p>`;
        el.querySelector('button').onclick = async () => { await call('DELETE', 'api/repos?url=' + encodeURIComponent(repo.url)); load(); };
        $('repos').append(el);
      }
      $('pkgs').innerHTML = '';
      if (!d.packages.length && !d.other_installed.length) $('pkgs').innerHTML = '<p class="muted">Nothing to show yet.</p>';
      for (const p of d.packages) {
        const el = document.createElement('div'); el.className = 'card';
        const ver = p.installed_version ? (p.status === 'update' ? `installed ${esc(p.installed_version)}, latest ${esc(p.version)}` : esc(p.version)) : esc(p.version);
        el.innerHTML = `<h3><span>${esc(p.name)} <span class="muted">${ver}</span></span><span class="badge ${p.status}">${LABEL[p.status]}</span></h3>
          <p>${esc(p.description)}${p.requires.length ? '<br>Needs: ' + p.requires.map(esc).join(', ') : ''}
          ${p.missing_requires.length ? '<br><span class="err">Install first: ' + p.missing_requires.map(esc).join(', ') + '</span>' : ''}</p>`;
        if (p.status !== 'installed') el.append(cmdRow(p.install));
        if (p.installed_version !== null) el.append(cmdRow(p.remove, 'danger'));
        $('pkgs').append(el);
      }
      if (d.other_installed.length) {
        const h = document.createElement('h2'); h.textContent = 'Installed from elsewhere'; $('pkgs').append(h);
        for (const p of d.other_installed) {
          const el = document.createElement('div'); el.className = 'card';
          el.innerHTML = `<h3><span>${esc(p.name)} <span class="muted">${esc(p.version)}</span></span><span class="badge installed">installed</span></h3>`;
          el.append(cmdRow(p.remove, 'danger')); $('pkgs').append(el);
        }
      }
    }

    $('addForm').onsubmit = async e => {
      e.preventDefault();
      const res = await call('POST', 'api/repos', { url: $('url').value });
      $('msg').textContent = res.ok ? '' : (await res.json()).error;
      if (res.ok) $('url').value = '';
      load();
    };
    ghStatus(); load();
  </script>
</body>
</html>
