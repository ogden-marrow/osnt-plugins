<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Packages</title>
  <base target="_top">
  <link rel="stylesheet" href="/static/osnt-ui.css">
  <style>
    .pkg .name { font-weight: 650; font-size: var(--fs-lg); }
    .pkg .ver { color: var(--ink-3); font-size: var(--fs-sm); margin-left: 6px; font-weight: 400; }
    .pkg .desc { margin: 4px 0 0; color: var(--ink-2); font-size: var(--fs-md); max-width: 70ch; }
    .pkg .meta { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: var(--fs-sm); color: var(--ink-3); }
    .tag { background: var(--surface-2); border-radius: 6px; padding: 1px 8px; color: var(--ink-2); }
    .tag.bad { background: var(--err-soft); color: var(--err); }
    .pkg.busy { border-color: var(--accent); }
    .progress { margin-top: 12px; display: flex; gap: 10px; align-items: center; font-size: var(--fs-md); }
    .progress.ok { color: var(--ok); } .progress.err { color: var(--err); }
    dialog.dialog { width: min(540px, calc(100vw - 32px)); }
    dialog.dialog ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: var(--fs-md); line-height: 1.6; }
    dialog.dialog .sys { margin: 14px 0; }
    dialog.dialog .sys ul { color: var(--ink); }
    .code-big { font: 600 30px/1.2 var(--font-mono); letter-spacing: .2em; margin: 8px 0; background: none; padding: 0; }
  </style>
</head>
<body>
  <main class="page" id="main">
    <div class="row" style="margin-bottom:16px">
      <div class="grow" style="min-width:200px"><input type="search" id="q" class="input" placeholder="Search packages" aria-label="Search packages" style="width:100%"></div>
      <div class="seg" id="chips" role="group" aria-label="Filter">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="installed" aria-pressed="false">Installed</button>
        <button data-f="available" aria-pressed="false">Not installed</button>
        <button data-f="update" aria-pressed="false">Updates</button>
      </div>
      <button id="refresh" class="btn ghost" title="Check the repositories again">Refresh</button>
    </div>
    <div id="banner"></div>
    <div id="pkgs" class="stack-sm" aria-live="polite"><span class="loading"><span class="spin"></span>Loading packages</span></div>

    <h2 class="group-label">Repositories</h2>
    <div id="repos" class="stack-sm"></div>
    <form id="addForm" class="row" style="margin-top:10px">
      <div class="grow"><input type="text" id="url" class="input" placeholder="https://github.com/owner/repo" aria-label="GitHub repository link" autocomplete="off" style="width:100%"></div>
      <button class="btn primary">Add repository</button>
    </form>
    <p class="err small" id="msg" role="alert"></p>

    <h2 class="group-label">GitHub</h2>
    <div class="card" id="gh"><span class="loading"><span class="spin"></span>Checking</span></div>
  </main>

  <dialog class="dialog" id="dlg" aria-labelledby="dlgTitle"><form method="dialog" id="dlgForm"></form></dialog>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const call = (method, path, body) => fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) });
    const LABEL = { installed: 'Installed', update: 'Update available', available: 'Not installed' };
    let data = { packages: [], other_installed: [], repos: [], github: false };
    let filter = 'all', query = '', working = false;
    const progress = {}; // plugin id -> { text, state, keys }

    async function load(fresh = false) {
      const r = await call('GET', 'api/packages' + (fresh ? '?fresh=1' : ''));
      if (r.status === 401) { top.location.href = '/login?next=/settings%23packages'; return; }
      data = await r.json();
      render();
    }

    function render() {
      renderRepos();
      const updates = data.packages.filter(p => p.status === 'update' && p.installable);
      $('banner').innerHTML = '';
      if (updates.length && !working) {
        const b = document.createElement('div'); b.className = 'notice info'; b.style.marginBottom = '12px';
        b.innerHTML = `<div class="grow"><b>${updates.length} update${updates.length > 1 ? 's' : ''} available</b><div class="small">${updates.map(p => esc(p.name)).join(', ')}</div></div><button class="btn primary sm">Update all</button>`;
        b.querySelector('button').onclick = () => updateAll(updates);
        $('banner').append(b);
      }
      const all = [...data.packages, ...data.other_installed.map(o => ({ ...o, status: 'installed', installed_version: o.version, local: true, description: 'Installed from outside your repositories.', requires: [], missing_requires: [] }))];
      const list = all.filter(p => (filter === 'all' || p.status === filter) && (!query || (p.name + ' ' + p.id + ' ' + (p.description || '')).toLowerCase().includes(query)));
      const box = $('pkgs'); box.innerHTML = '';
      if (!data.repos.length) {
        box.innerHTML = '<div class="state"><div class="h3">Add a package repository to get started</div><p>Paste a GitHub link in the box under Repositories. Private repositories work after you connect GitHub below.</p></div>';
        return;
      }
      if (!list.length) box.innerHTML = `<div class="state"><div class="h3">${all.length ? 'No packages match' : 'Nothing here yet'}</div><p>${all.length ? 'Try another filter or search.' : 'The repositories above did not list any packages.'}</p></div>`;
      for (const p of list) box.append(card(p));
    }

    function card(p) {
      const el = document.createElement('div'); el.className = 'card pkg'; el.id = 'pkg-' + p.id;
      const prog = progress[p.id];
      const ver = p.installed_version ? (p.status === 'update' && p.version ? `${esc(p.installed_version)} &rarr; ${esc(p.version)}` : esc(p.installed_version)) : esc(p.version);
      const badge = p.status === 'installed' ? 'ok' : p.status === 'update' ? 'warn' : '';
      const blocked = !!(p.missing_requires && p.missing_requires.some(r => !data.packages.some(x => x.id === r && x.installable)));
      el.innerHTML = `<div class="card-head" style="align-items:flex-start;margin-bottom:0"><div class="grow" style="min-width:200px"><span class="name">${esc(p.name)}</span><span class="ver">${ver}</span>
          <span class="badge ${badge}" style="margin-left:8px">${LABEL[p.status]}</span>${p.core ? ' <span class="badge">Core</span>' : ''}
          <p class="desc">${esc(p.description)}</p></div><div class="row actions"></div></div><div class="meta"></div>`;
      const act = el.querySelector('.actions'), meta = el.querySelector('.meta');
      const add = (label, cls, fn, disabled, title) => { const b = document.createElement('button'); b.textContent = label; b.className = 'btn ' + (cls || ''); b.disabled = working || !!disabled; if (title) b.title = title; b.onclick = fn; act.append(b); };
      if (p.status !== 'available') { const a = document.createElement('a'); a.href = '/p/' + p.id + '/'; a.className = 'btn ghost'; a.textContent = 'Open'; act.append(a); }
      if (p.status === 'available') add('Install', 'primary', () => confirmInstall(p), !p.installable || blocked, !p.installable ? 'No build has been published yet' : blocked ? 'A required package is not available' : '');
      if (p.status === 'update') add('Update', 'primary', () => confirmInstall(p), !p.installable, !p.installable ? 'No build has been published yet' : '');
      if (p.status !== 'available' && !p.core) add('Uninstall', 'danger', () => confirmRemove(p), p.dependents && p.dependents.length, p.dependents && p.dependents.length ? 'Remove ' + p.dependents.join(', ') + ' first' : '');
      if (p.requires && p.requires.length) meta.insertAdjacentHTML('beforeend', 'Needs ' + p.requires.map(r => `<span class="tag ${p.missing_requires.includes(r) ? 'bad' : ''}">${esc(r)}</span>`).join(''));
      if (p.dependents && p.dependents.length) meta.insertAdjacentHTML('beforeend', 'Used by ' + p.dependents.map(r => `<span class="tag">${esc(r)}</span>`).join(''));
      if (!p.local && !p.installable) meta.insertAdjacentHTML('beforeend', '<span class="tag">No build published yet. Run the repository&rsquo;s release workflow (Actions tab).</span>');
      if (!meta.children.length && !meta.textContent) meta.remove();
      if (prog) {
        el.classList.toggle('busy', prog.state === 'running');
        const s = document.createElement('div'); s.className = 'progress ' + (prog.state === 'done' ? 'ok' : prog.state === 'failed' ? 'err' : '');
        s.setAttribute('role', prog.state === 'failed' ? 'alert' : 'status');
        s.innerHTML = (prog.state === 'running' ? '<span class="spin"></span>' : '') + `<span>${esc(prog.text)}</span>` + (prog.keys ? ' <a href="/settings#credentials">Add API keys</a>' : '');
        el.append(s);
      }
      return el;
    }

    // ---- confirmation dialogs ----
    function ask(html, okLabel, okClass) {
      return new Promise(res => {
        const dlg = $('dlg'), form = $('dlgForm');
        form.innerHTML = html + `<div class="actions"><button type="button" value="no" class="btn ghost">Cancel</button><button type="submit" class="btn ${okClass || 'primary'}" value="yes">${okLabel}</button></div>`;
        form.querySelector('[value=no]').onclick = () => dlg.close('no');
        dlg.onclose = () => res(dlg.returnValue === 'yes' ? { purge: !!form.querySelector('#purge')?.checked } : null);
        dlg.returnValue = 'no'; dlg.showModal();
      });
    }

    async function details(p) {
      try { const r = await call('GET', 'api/details?repo=' + encodeURIComponent(p.repo) + '&id=' + encodeURIComponent(p.id)); if (r.ok) return await r.json(); } catch {}
      return {};
    }

    async function confirmInstall(p) {
      const deps = (p.missing_requires || []).map(r => data.packages.find(x => x.id === r)).filter(Boolean);
      const steps = [...deps, p];
      const ds = await Promise.all(steps.map(details));
      const d = ds[ds.length - 1];
      const apt = [...new Set(ds.flatMap(x => x.system?.apt || []))];
      const downloads = ds.flatMap(x => x.system?.downloads || []);
      const approvals = [...new Set(ds.flatMap(x => x.system?.approvals || []))];
      const secrets = (d.secrets || []).map(s => `<li>${esc(s.label || s.name)} <code>${esc(s.name)}</code>${s.required ? ' (required)' : ''}</li>`).join('');
      const hasSystem = apt.length || downloads.length;
      const system = hasSystem ? `<div class="notice warn sys"><div><b>This will install software on your Pi</b><ul>
          ${apt.map(a => `<li><code>${esc(a)}</code>: a Raspberry Pi OS package (installed with apt, as root)</li>`).join('')}
          ${downloads.map(x => `<li><code>${esc(x.name)}</code>: a program downloaded from ${esc(x.url.split('/').slice(2, 5).join('/'))}, ${x.verified ? 'checksum verified' : 'not checksum verified'}</li>`).join('')}
        </ul></div></div>` : '';
      const ok = await ask(`<h2 id="dlgTitle">${p.status === 'update' ? 'Update' : 'Install'} ${esc(p.name)}</h2><p>${esc(p.description)}</p>${system}<ul>
          <li>Runs as a sandboxed service on this Pi, with network access.</li>
          <li>${d.stores_data ? 'Keeps its own data on the Pi.' : 'Keeps no data of its own.'}</li>
          ${deps.length ? `<li>Also installs the packages it needs: <b>${deps.map(x => esc(x.name)).join(', ')}</b>.</li>` : ''}
          ${secrets ? `<li>Can read these credentials once you add them:<ul>${secrets}</ul></li>` : '<li>Asks for no credentials.</li>'}
        </ul><p class="small faint" style="margin:12px 0 16px">Only install packages from repositories you trust: they run code on your Pi.</p>`,
        hasSystem ? 'Install and add software' : (p.status === 'update' ? 'Update' : 'Install'));
      if (ok) run(steps.map(x => ({ kind: 'install', pkg: x, approved: approvals })));
    }

    async function confirmRemove(p) {
      const ok = await ask(`<h2 id="dlgTitle">Uninstall ${esc(p.name)}?</h2><p>The service stops and disappears from the launcher. Credentials you saved stay in your key store, and software it installed on the Pi (such as ffmpeg) is kept.</p>
        <label class="check"><input type="checkbox" id="purge"> Also delete the data it stored on the Pi</label>`, 'Uninstall', 'danger');
      if (ok) run([{ kind: 'remove', pkg: p, purge: ok.purge }]);
    }

    async function updateAll(list) {
      // An update may need new system software; ask once per package that does.
      for (const p of list) { const d = await details(p); if (d.system && d.system.approvals?.length) { return confirmInstall(p); } }
      run(list.map(p => ({ kind: 'install', pkg: p, approved: [] })));
    }

    // ---- running jobs ----
    async function runJob(step) {
      const { kind, pkg } = step;
      const set = (text, state, keys) => { progress[pkg.id] = { text, state, keys }; render(); };
      set(kind === 'install' ? 'Starting' : 'Removing', 'running');
      const r = await call('POST', kind === 'install' ? 'api/install' : 'api/remove', kind === 'install' ? { repo: pkg.repo, id: pkg.id, approved: step.approved || [] } : { id: pkg.id, purge: !!step.purge });
      const j = await r.json();
      if (!r.ok) { set(j.error || 'Could not start', 'failed'); return false; }
      const started = Date.now();
      for (;;) {
        await new Promise(res => setTimeout(res, 1000));
        let s;
        try { s = await (await call('GET', 'api/jobs/' + j.job)).json(); } catch { continue; }
        if (s.state === 'done') { set(s.message, 'done', kind === 'install' && /asks for/i.test(s.message)); return true; }
        if (s.state === 'failed') { set(s.message, 'failed'); return false; }
        const waiting = s.state === 'queued' && Date.now() - started > 20000;
        set(waiting ? 'The installer service has not picked this up. Is osnt-helper running on the Pi?' : s.message, waiting ? 'failed' : 'running');
        if (waiting) return false;
        if (Date.now() - started > 1800000) { set('Timed out waiting for the installer', 'failed'); return false; }
      }
    }

    async function run(steps) {
      working = true; render();
      for (const s of steps) { if (!(await runJob(s))) break; }
      working = false;
      await load(true);
    }

    // ---- repositories ----
    function renderRepos() {
      const box = $('repos'); box.innerHTML = '';
      if (!data.repos.length) box.innerHTML = '<p class="muted small">No repositories yet.</p>';
      for (const repo of data.repos) {
        const el = document.createElement('div'); el.className = 'card row spread';
        el.innerHTML = `<div class="grow"><div class="wrap-anywhere">${esc(repo.url.replace('https://github.com/', ''))}</div><div class="small ${repo.ok ? 'faint' : 'err'}">${repo.ok ? `${esc(repo.count)} packages${repo.published ? '' : ' &middot; no published build yet'}` : esc(repo.error)}</div></div><button class="btn danger ghost sm">Remove</button>`;
        el.querySelector('button').onclick = async () => { await call('DELETE', 'api/repos?url=' + encodeURIComponent(repo.url)); load(true); };
        box.append(el);
      }
    }

    $('addForm').onsubmit = async e => {
      e.preventDefault();
      const res = await call('POST', 'api/repos', { url: $('url').value });
      $('msg').textContent = res.ok ? '' : (await res.json()).error;
      if (res.ok) { $('url').value = ''; await load(true); }
    };
    $('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
    $('chips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; document.querySelectorAll('#chips button').forEach(c => c.setAttribute('aria-pressed', String(c === b))); render(); };
    $('refresh').onclick = async e => { e.target.disabled = true; await load(true); e.target.disabled = false; };

    // ---- GitHub connection (device flow) ----
    let polling = false;
    async function ghStatus() {
      const d = await (await call('GET', 'api/github')).json();
      const box = $('gh');
      if (d.connected) {
        box.innerHTML = `<div class="row spread"><div class="grow"><b>Connected as ${esc(d.login)}</b><div class="small muted">Private repositories where the OSNT GitHub App is installed can be read.</div></div><button class="btn danger ghost sm">Disconnect</button></div>`;
        box.querySelector('button').onclick = async () => { await call('DELETE', 'api/github'); ghStatus(); load(true); };
      } else if (!polling) {
        box.innerHTML = `<div class="row spread"><div class="grow"><b>Not connected</b><div class="small muted">${d.stored ? 'The saved sign-in has expired. ' : ''}Needed only for private repositories.</div></div><button class="btn primary">Connect GitHub</button></div><p class="err small" id="ghErr" role="alert"></p>`;
        box.querySelector('button').onclick = ghConnect;
      }
    }
    async function ghConnect() {
      const r = await call('POST', 'api/github/start'); const d = await r.json();
      if (!r.ok) { $('ghErr').textContent = d.error; return; }
      polling = true;
      $('gh').innerHTML = `<b>Enter this code on GitHub</b><div><code class="code-big">${esc(d.user_code)}</code></div>
        <p class="small muted" style="margin:0">Open <a href="${esc(d.verification_uri)}" target="_blank" rel="noopener noreferrer">${esc(d.verification_uri)}</a> on any device, type the code and approve. This page continues by itself.</p>`;
      let wait = Math.max(5, d.interval || 5); const deadline = Date.now() + (d.expires_in || 900) * 1000;
      while (Date.now() < deadline) {
        await new Promise(res => setTimeout(res, wait * 1000));
        const p = await call('POST', 'api/github/poll'); const j = await p.json();
        if (!p.ok || j.status === 'failed') { polling = false; await ghStatus(); $('ghErr').textContent = j.error || ''; return; }
        if (j.status === 'connected') break;
        if (j.slow_down) wait += 5;
      }
      polling = false; await ghStatus(); load(true);
    }

    ghStatus(); load();
  </script>
</body>
</html>
