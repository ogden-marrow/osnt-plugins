[package]
name = "osnt-yt-mp3"
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
name = "yt_mp3"
path = "src/lib.rs"

[[bin]]
name = "osnt-yt-mp3"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
osnt-common = { path = "../../sdk" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
