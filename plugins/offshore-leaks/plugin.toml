id = "offshore-leaks"
name = "Offshore Leaks"
description = "Search ICIJ's Offshore Leaks database for companies, trusts and foundations: jurisdiction, status, source leak and a map. No individuals."
grid = "Organisations"
port = 8141
version = "0.1.1"

[service]
state_dir = true

[service.env]
OSNT_LEAKS_BIND = "127.0.0.1:{port}"
OSNT_LEAKS_STATE = "{state_dir}/cache"
