<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNT Lookup</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; }
    header { padding: 10px 16px; border-bottom: 1px solid #243040; font-size: 16px; letter-spacing: .08em; }
    header a { color: inherit; text-decoration: none; }
    main { max-width: 980px; margin: 0 auto; padding: 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px 10px; background: #151c24; color: inherit; border: 1px solid #2d3a4a; border-radius: 6px; font-size: 15px; }
    button { background: #151c24; color: inherit; border: 1px solid #2d3a4a; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    button:hover { border-color: #3fae91; }
    section { margin-top: 16px; padding: 12px 14px; border: 1px solid #243040; border-radius: 8px; background: #151c24; }
    h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7f93a8; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { text-align: left; padding: 3px 8px 3px 0; vertical-align: top; word-break: break-all; }
    th { color: #8aa; font-weight: 500; white-space: nowrap; }
    .muted { color: #8aa; } .err { color: #ef6c6c; }
    code { font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <header><a href="/">&larr; OSNT</a> / DOMAIN &amp; IP LOOKUP</header>
  <main>
    <form id="f"><input id="q" placeholder="example.com or 1.1.1.1" autofocus autocomplete="off"><button>Look up</button><button type="button" id="ct">Cert names</button></form>
    <div id="out"></div>
  </main>
  <script>
    const $ = id => document.getElementById(id), out = $('out');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const section = (title, html) => out.insertAdjacentHTML('beforeend', `<section><h2>${esc(title)}</h2>${html}</section>`);
    const rows = o => `<table>${o.filter(([, v]) => v != null && v !== '' && !(Array.isArray(v) && !v.length)).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(Array.isArray(v) ? v.join(', ') : v)}</td></tr>`).join('')}</table>`;
    async function api(path) {
      const r = await fetch(path), d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.status);
      return d;
    }
    function showRdap(r) {
      if (!r) return section('Registration (RDAP)', '<span class="muted">not available for this input</span>');
      const ev = Object.fromEntries((r.events || []).map(e => [e.action, e.date]));
      section('Registration (RDAP)', rows([['name', r.name || r.handle], ['status', r.status], ['registered', ev.registration], ['last changed', ev['last changed']],
        ['expires', ev.expiration], ['nameservers', r.nameservers], ['range', r.start && `${r.start} – ${r.end}`], ['country', r.country], ['type', r.type],
        ['entities', (r.entities || []).map(e => `${e.name || e.handle} (${(e.roles || []).join('/')})`)]]));
    }
    $('f').onsubmit = async e => {
      e.preventDefault(); out.innerHTML = '<span class="muted">looking up…</span>';
      try {
        const d = await api('api/lookup?q=' + encodeURIComponent($('q').value));
        out.innerHTML = '';
        if (d.kind === 'domain') {
          section('DNS', rows(Object.entries(d.dns || {}).map(([t, a]) => [t, a.map(x => x.data)])) || '<span class="muted">no data</span>');
        } else section('Reverse DNS', rows([['PTR', d.ptr]]));
        showRdap(d.rdap);
      } catch (err) { out.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
    $('ct').onclick = async () => {
      out.innerHTML = '<span class="muted">searching certificate transparency (can take 20 s)…</span>';
      try {
        const d = await api('api/certs?name=' + encodeURIComponent($('q').value));
        out.innerHTML = ''; section(`Certificate names for ${d.domain}`,
          `<div class="muted">${d.certificates} certificates, earliest ${esc(d.earliest_seen)}</div><code>${d.names.map(esc).join('<br>')}</code>`);
      } catch (err) { out.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
  </script>
</body>
</html>
