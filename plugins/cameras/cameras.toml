# Camera feeds: still-image URLs that update periodically (the origin replaces the image each time).
# Only URLs listed here are ever fetched. Add lat/lon to place a camera on the map.
# Override at runtime with OSNT_CAMERAS=/path/to/cameras.toml (re-read per request).
# No default feeds are shipped. Add your own below, for example:
#
# [[camera]]
# id = "harbour"
# name = "Harbour webcam"
# group = "Ports"
# url = "https://example.com/cam.jpg"
# lat = 0.0
# lon = 0.0
