# Camera feeds: still-image URLs that update periodically (the origin replaces the image each time).
# Only URLs listed here are ever fetched. Add lat/lon to place a camera on the map.
# Override at runtime with OSNT_CAMERAS=/path/to/cameras.toml (re-read per request).
# These are publicly published snapshot feeds from UF Recreational Sports (about 1 frame per second).
# NOTE (2026-11-02): recsports.ufl.edu serves an incomplete TLS chain (missing the InCommon OVG2C intermediate) and
# redirects http to https, so strict clients, including this one, reject it until UF fixes it. Tiles show a red border meanwhile.
# This plugin only displays them; it does not analyse or identify people.

[[camera]]
id = "swrc-weights-1"
name = "SWRC Weight Room 1"
group = "Southwest Rec Center"
url = "http://recsports.ufl.edu/cam/cam1.jpg"

