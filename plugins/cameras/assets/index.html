<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cameras · OSNT</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%230c7a62%27 stroke-width=%272.2%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%279%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%273.2%27 fill=%27%230c7a62%27 stroke=%27none%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/osnt-ui.css">
  <style>
    #groups h2 { margin: 24px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    #groups h2:first-child { margin-top: 0; }
    #groups .grid { grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
    figure { margin: 0; border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    figure.stale { border-color: var(--err); }
    figure.stale figcaption::after { content: "No signal"; color: var(--err); font-weight: 600; margin-left: 8px; }
    figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #05080a; }
    figcaption { padding: 8px 12px; font-size: 13px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    figcaption .ts { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
    figure.stale img { color: transparent; }
    #map { height: 260px; margin-bottom: 20px; border-radius: var(--radius); border: 1px solid var(--edge); display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Back to OSNT hub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 3v4" stroke-linecap="round"/></svg>
      OSNT
    </a>
    <span class="sep" aria-hidden="true">/</span><h1>Cameras</h1>
    <div class="bar-end"><span id="status" class="status" role="status" aria-live="polite"></span></div>
  </header>
  <main class="page wide"><div id="map"></div><div id="groups"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading cameras…</div></div></main>
  <script src="/static/leaflet/leaflet.js"></script>
  <script src="/static/osnt-map.js"></script>
  <script>
    const REFRESH_MS = 2000;
    (async () => {
      const root = document.getElementById('groups');
      let cams;
      try {
        const r = await fetch('api/cameras');
        if (r.status === 401) { location.href = '/login?next=/p/cameras/'; return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        cams = await r.json();
      } catch (e) {
        root.innerHTML = '<div class="state error" role="alert"><div class="h3">Could not load cameras</div><p>The camera service did not respond.</p><button class="btn" onclick="location.reload()">Try again</button></div>';
        document.getElementById('status').textContent = 'offline';
        return;
      }
      root.innerHTML = '';
      if (!cams.length) {
        root.innerHTML = '<div class="state"><div class="h3">No cameras configured</div><p>Add cameras to this plugin\'s configuration and they will appear here, refreshed every 2 seconds.</p></div>';
        document.getElementById('status').textContent = '0 cameras';
        return;
      }
      const groups = {};
      for (const c of cams) (groups[c.group || 'Cameras'] ??= []).push(c);
      const frames = [];
      for (const [name, list] of Object.entries(groups)) {
        root.insertAdjacentHTML('beforeend', `<h2></h2><div class="grid"></div>`);
        root.querySelector('h2:last-of-type').textContent = name;
        const grid = root.querySelector('.grid:last-of-type');
        for (const c of list) {
          const fig = document.createElement('figure'), img = document.createElement('img'), cap = document.createElement('figcaption');
          cap.innerHTML = '<span></span><span class="ts"></span>'; cap.firstChild.textContent = c.name;
          img.alt = c.name; img.onload = () => { fig.classList.remove('stale'); cap.lastChild.textContent = new Date().toLocaleTimeString(); };
          img.onerror = () => fig.classList.add('stale');
          fig.append(img, cap); grid.append(fig); frames.push({ c, img });
        }
      }
      const tick = () => { if (!document.hidden) for (const { c, img } of frames) img.src = `snap/${c.id}?t=${Date.now()}`; };
      tick(); setInterval(tick, REFRESH_MS);
      document.getElementById('status').textContent = `${cams.length} camera${cams.length === 1 ? '' : 's'} · every ${REFRESH_MS / 1000}s`;

      const placed = cams.filter(c => c.lat != null && c.lon != null);
      if (placed.length) {
        document.getElementById('map').style.display = 'block';
        const { map } = await OSNT.createMap('map');
        const pts = placed.map(c => L.marker([c.lat, c.lon]).addTo(map).bindPopup(c.name).getLatLng());
        map.fitBounds(L.latLngBounds(pts).pad(0.4), { maxZoom: 17 });
      }
    })();
  </script>
</body>
</html>
