id = "sanctions-screen"
name = "Sanctions screening"
description = "Fuzzy name search over official sanctions lists (OFAC, EU, UN, UK, US CSL, SECO, BIS) for companies, vessels and aircraft."
grid = "Organisations"
port = 8140
version = "0.1.1"

[service]
state_dir = true

[service.env]
OSNT_SANCTIONS_BIND = "127.0.0.1:{port}"
OSNT_SANCTIONS_STATE = "{state_dir}/lists"
