[package]
name = "osnt-adsb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
redb = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["gzip", "json"] }
osnt-common = { path = "../../sdk" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
