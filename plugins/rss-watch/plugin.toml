id = "rss-watch"
name = "Feed watcher"
description = "Poll your own RSS/Atom feeds, Hacker News keyword alerts and opt-in public Telegram channel previews, with keyword and regex alerts and a new-since-last-visit inbox."
grid = "Events & News"
port = 8150
version = "0.1.1"

[service]
state_dir = true

[service.env]
OSNT_RSS_BIND = "127.0.0.1:{port}"
OSNT_RSS_DB = "{state_dir}/rss.redb"
