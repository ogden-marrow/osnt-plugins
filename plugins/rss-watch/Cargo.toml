[package]
name = "osnt-rss-watch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
redb = "2"
quick-xml = "0.37"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }
rustls-rustcrypto = "0.0.2-alpha"
osnt-common = { path = "../../sdk" }

[dev-dependencies]
hmac = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
