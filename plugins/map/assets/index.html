<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Map · OSNT</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%230c7a62%27 stroke-width=%272.2%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%279%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%273.2%27 fill=%27%230c7a62%27 stroke=%27none%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/osnt-ui.css">
</head>
<body class="fixed">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Back to OSNT hub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M12 3v4" stroke-linecap="round"/></svg>
      OSNT
    </a>
    <span class="sep" aria-hidden="true">/</span><h1>Map</h1>
    <div class="bar-end"><span id="status" class="status" role="status" aria-live="polite">Connecting…</span></div>
  </header>
  <div class="fill map-box"><div id="map" style="position:absolute;inset:0"></div>
  <div id="readout" class="readout">Move the cursor over the map</div></div>
  <script src="/static/leaflet/leaflet.js"></script>
  <script src="/static/osnt-map.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const { cfg } = await OSNT.createMap('map', { readout: 'readout' });
        const h = await (await fetch('/api/health')).json();
        status.textContent = `server ${h.status} · v${h.version} · ${cfg.layer.length} layers`;
      } catch { status.textContent = 'Failed to load'; status.classList.add('err'); }
    })();
  </script>
</body>
</html>
