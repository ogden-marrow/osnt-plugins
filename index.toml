path = "plugins/credentials"

[[plugin]]
id = "provenance"
name = "Image source finder"
description = "Agentic search for the likely original source of an image: reverse-image search, page dates and Wayback."
version = "0.4.2"
path = "plugins/provenance"

[[plugin]]
id = "packages"
name = "Packages"
