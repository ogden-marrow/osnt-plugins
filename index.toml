# Plugin repository index. `osnt plugin search` and `osnt plugin add <id>` read this file.

[[plugin]]
id = "adsb"
name = "Aircraft (ADS-B)"
description = "Live aircraft, military traffic and emergency squawks, with a recorded position history."
version = "0.1.1"
path = "plugins/adsb"

[[plugin]]
id = "imagery"
name = "Imagery timeline"
description = "Compare NASA satellite imagery across dates, with fire and thermal detections."
version = "0.1.1"
path = "plugins/imagery"

[[plugin]]
id = "lookup"
name = "Domain & IP lookup"
description = "DNS, registration (RDAP), reverse DNS and certificate-transparency names."
version = "0.1.1"
path = "plugins/lookup"

[[plugin]]
id = "imgmeta"
name = "Image forensics"
description = "EXIF, hashes and editing/GPS flags for an image, plus reverse-image-search links."
version = "0.1.1"
path = "plugins/imgmeta"

[[plugin]]
id = "cameras"
name = "Live cameras"
description = "Grid of live still-image camera feeds with map placement."
version = "0.1.1"
path = "plugins/cameras"

[[plugin]]
id = "example"
name = "Example plugin"
description = "Minimal starting point for writing a plugin."
version = "0.1.1"
path = "plugins/example"

[[plugin]]
id = "map"
name = "Map"
description = "Base maps, satellite, terrain and elevation layers streamed on demand."
version = "0.1.1"
path = "plugins/map"

[[plugin]]
id = "credentials"
name = "Credentials"
description = "Store API keys on the Pi and hand each one only to the plugins that declare it."
version = "0.2.1"
path = "plugins/credentials"

[[plugin]]
id = "provenance"
name = "Image source finder"
description = "Agentic search for the likely original source of an image: reverse-image search, page dates and Wayback."
version = "0.4.1"
path = "plugins/provenance"

[[plugin]]
id = "packages"
name = "Packages"
description = "Package repositories, and which of their plugins are installed on this hub."
version = "0.2.0"
path = "plugins/packages"

[[plugin]]
id = "doppler"
name = "Doppler flyby check"
description = "Estimate speed, closest approach and distance of an aircraft or vehicle pass from the Doppler shift in a recording, to sanity-check a clip's claims."
version = "0.1.0"
path = "plugins/doppler"

[[plugin]]
id = "yt-mp3"
name = "YouTube to MP3"
description = "Paste a YouTube link, optionally trim it, and download an MP3."
version = "0.1.0"
path = "plugins/yt-mp3"

[[plugin]]
id = "adsb-history"
name = "Aircraft history (ADS-B)"
description = "Pull just the window you need out of adsb.lol's daily global ADS-B archive (time, area, ICAO hex, callsign), keep it as a short-lived slice, and serve it as an API for other plugins."
version = "0.1.0"
path = "plugins/adsb-history"

[[plugin]]
id = "satellite"
name = "Satellite scenes"
description = "Search Sentinel-2, Sentinel-1 radar, Landsat and NAIP scenes by area, date and cloud cover, and view or compare them on the map."
version = "0.1.0"
path = "plugins/satellite"

[[plugin]]
id = "wayback"
name = "Imagery history (Wayback)"
description = "Step through dated releases of Esri World Imagery to see how a place changed, and compare two dates side by side."
version = "0.1.0"
path = "plugins/wayback"

[[plugin]]
id = "opendata"
name = "Disaster imagery (Maxar Open Data)"
description = "Browse Maxar's free event imagery for disasters and crises, and compare acquisitions before and after."
version = "0.1.0"
path = "plugins/opendata"
