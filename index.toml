version = "0.2.2"
path = "plugins/packages"

[[plugin]]
id = "doppler"
name = "Doppler flyby check"
description = "Estimate speed, closest approach and distance of an aircraft or vehicle pass from the Doppler shift in a recording, to sanity-check a clip's claims."
version = "0.1.1"
path = "plugins/doppler"

[[plugin]]
id = "yt-mp3"
name = "YouTube to MP3"
description = "Paste a YouTube link, optionally trim it, and download an MP3."
version = "0.1.1"
path = "plugins/yt-mp3"

[[plugin]]
id = "adsb-history"
name = "Aircraft history (ADS-B)"
description = "Pull just the window you need out of adsb.lol's daily global ADS-B archive (time, area, ICAO hex, callsign), keep it as a short-lived slice, and serve it as an API for other plugins."
version = "0.1.1"
path = "plugins/adsb-history"

[[plugin]]
id = "satellite"
name = "Satellite scenes"
description = "Search Sentinel-2, Sentinel-1 radar, Landsat and NAIP scenes by area, date and cloud cover, and view or compare them on the map."
version = "0.1.1"
path = "plugins/satellite"

[[plugin]]
id = "wayback"
name = "Imagery history (Wayback)"
description = "Step through dated releases of Esri World Imagery to see how a place changed, and compare two dates side by side."
version = "0.1.1"
path = "plugins/wayback"

[[plugin]]
id = "opendata"
name = "Disaster imagery (Maxar Open Data)"
description = "Browse Maxar's free event imagery for disasters and crises, and compare acquisitions before and after."
version = "0.1.1"
path = "plugins/opendata"

[[plugin]]
id = "quake-tsunami"
name = "Earthquakes & tsunami"
description = "Recent and historical earthquakes (USGS, EMSC) on a map, plus live PTWC/NTWC tsunami bulletins."
version = "0.1.1"
path = "plugins/quake-tsunami"

[[plugin]]
id = "hazard-events"
name = "Hazard events"
description = "One map of active disasters: GDACS alerts, NASA EONET, NWS alerts, volcano reports, active storms."
version = "0.1.1"
path = "plugins/hazard-events"

[[plugin]]
id = "fire-watch"
name = "Fire watch"
description = "Active-fire detections as clusters with FRP statistics, daily trends and area watches that flag new fires."
version = "0.1.1"
path = "plugins/fire-watch"

[[plugin]]
id = "space-watch"
name = "Launches & orbital objects"
description = "Upcoming and past rocket launches with a pad map, and CelesTrak orbital elements and catalog data by name, NORAD ID or group."
version = "0.1.1"
path = "plugins/space-watch"

[[plugin]]
id = "ip-intel"
name = "IP intelligence"
description = "One IP or hostname: owner, routing, exposed ports, geolocation cross-check and blocklist membership, from open sources."
version = "0.1.1"
path = "plugins/ip-intel"

[[plugin]]
id = "asn-bgp"
name = "ASN & BGP explorer"
description = "Autonomous systems: holder, announced prefixes, upstream and downstream neighbours, route history and BGP state, PeeringDB and RIPE Atlas counts."
version = "0.1.1"
path = "plugins/asn-bgp"

[[plugin]]
id = "subdomain-enum"
name = "Subdomain discovery"
description = "Passive subdomain discovery from certificate logs, passive DNS and web archives, with DNS liveness and dangling-CNAME flags."
version = "0.1.1"
path = "plugins/subdomain-enum"

[[plugin]]
id = "domain-hygiene"
name = "Domain hygiene"
description = "Scored checklist for a domain: DNS records, SPF/DMARC/DKIM/MTA-STS, DNSSEC, delegation, CAA and security.txt."
version = "0.1.1"
path = "plugins/domain-hygiene"

[[plugin]]
id = "gdelt-news"
name = "Global news monitor (GDELT)"
description = "Search worldwide news coverage with volume and tone timelines, the latest GDELT export files, and saved stories that flag volume spikes."
version = "0.1.1"
path = "plugins/gdelt-news"

[[plugin]]
id = "rss-watch"
name = "Feed watcher"
description = "Poll your own RSS/Atom feeds, Hacker News keyword alerts and opt-in public Telegram channel previews, with keyword and regex alerts and a new-since-last-visit inbox."
version = "0.1.1"
path = "plugins/rss-watch"

[[plugin]]
id = "wiki-intel"
name = "Wikipedia event watch"
description = "Wikipedia On this day and current events, page-view spike detection and live change notices for watched topics, and Wikidata facts for organisations, places and events."
version = "0.1.1"
path = "plugins/wiki-intel"

[[plugin]]
id = "conflict-events"
name = "Conflict events"
description = "Georeferenced armed-conflict events from UCDP (free token) and optionally ACLED, on a map with timeline and event-type breakdown."
version = "0.1.1"
path = "plugins/conflict-events"

[[plugin]]
id = "web-archive"
name = "Web archives"
description = "Internet Archive snapshots per URL, snapshot text diffs, domain URL harvest, Common Crawl lookups and an archive-and-record evidence capture."
version = "0.1.0"
path = "plugins/web-archive"

[[plugin]]
id = "media-verify"
name = "Media verification"
description = "Video keyframes and metadata (ffprobe), YouTube thumbnail frames, perceptual-hash comparison, error-level analysis and a Content Credentials (C2PA) reader. No face or person matching."
version = "0.1.0"
path = "plugins/media-verify"

[[plugin]]
id = "case-notebook"
name = "Case notebook"
description = "Investigation cases with Markdown notes, a dated timeline and a tamper-evident evidence log; other plugins can pin results into a case."
version = "0.1.1"
path = "plugins/case-notebook"

[[plugin]]
id = "link-graph"
name = "Link graph"
description = "Maltego-style entity graph for domains, IPs, ASNs, organisations, vessels, aircraft, places and more. No person, username, email or phone nodes."
version = "0.1.1"
path = "plugins/link-graph"

[[plugin]]
id = "ais-vessels"
name = "Vessels (AIS)"
description = "Live ship positions and particulars by MMSI, IMO or name: Finland's Digitraffic AIS (Baltic) with no key, optional AISStream.io worldwide feed and Global Fishing Watch events. Vessels as objects only."
version = "0.1.1"
path = "plugins/ais-vessels"

[[plugin]]
id = "rail-live"
name = "Trains (live)"
description = "Live train positions and station boards from Finland (Digitraffic) and Norway (Entur), with an OpenRailwayMap track overlay. Trains as objects only."
version = "0.1.1"
path = "plugins/rail-live"

[[plugin]]
id = "aircraft-registry"
name = "Aircraft registry & routes"
description = "ICAO hex or tail number to type, manufacturer and organisation owner (private owners are never named), callsign to airline and route, airports, type designators, and a position cross-check across adsb.lol and OpenSky. Also an API for other plugins."
version = "0.1.1"
path = "plugins/aircraft-registry"

[[plugin]]
id = "maritime-notices"
name = "Maritime warnings"
description = "Active navigational and broadcast warnings (NGA MSI) by NAVAREA, with the positions in each warning drawn on the map: rocket debris areas, naval exercises, hazards. Piracy reports where NGA serves them."
version = "0.1.1"
path = "plugins/maritime-notices"

[[plugin]]
id = "sec-edgar"
name = "SEC filings"
description = "US-listed companies at SEC EDGAR: profile, filing timeline, annual XBRL figures and subsidiary-list links."
version = "0.1.1"
path = "plugins/sec-edgar"

[[plugin]]
id = "sanctions-screen"
name = "Sanctions screening"
description = "Fuzzy name search over official sanctions lists (OFAC, EU, UN, UK, US CSL, SECO, BIS) for companies, vessels and aircraft."
version = "0.1.1"
path = "plugins/sanctions-screen"

[[plugin]]
id = "offshore-leaks"
name = "Offshore Leaks"
description = "Search ICIJ's Offshore Leaks database for companies, trusts and foundations: jurisdiction, status, source leak and a map. No individuals."
version = "0.1.1"
path = "plugins/offshore-leaks"

[[plugin]]
id = "corp-registries"
name = "Company registries"
description = "Search company registers (GLEIF, Wikidata, Norway, Czechia, Finland, Denmark, optional UK/OpenCorporates/Aleph) and see ownership links. Companies only."
version = "0.1.1"
path = "plugins/corp-registries"

[[plugin]]
id = "money-trail"
name = "Public funds"
description = "Where public money goes: US contracts and grants, nonprofit Form 990 totals, federal lobbying filings and EU tenders, by organisation."
version = "0.1.1"
path = "plugins/money-trail"

[[plugin]]
id = "cve-watch"
name = "Vulnerability watch"
description = "CVE lookup merged from NVD, CISA KEV, EPSS, MITRE and OSV/GitHub advisories, with a recent-KEV feed, search and a product watchlist."
version = "0.1.1"
path = "plugins/cve-watch"

[[plugin]]
id = "threat-feeds"
name = "Threat feeds"
description = "Is this IP, network, domain, URL or hash on an open blocklist (Feodo, Spamhaus DROP, IPsum, Tor exits, OpenPhish, abuse.ch)? Shows since when and how fresh each feed is."
version = "0.1.1"
path = "plugins/threat-feeds"

[[plugin]]
id = "ioc-lookup"
name = "IOC reputation lookup"
description = "One IP, domain, URL or hash fanned out to urlscan, OTX, GreyNoise, mnemonic passive DNS, InternetDB and (with keys) VirusTotal and AbuseIPDB, one verdict per source."
version = "0.1.1"
path = "plugins/ioc-lookup"

[[plugin]]
id = "cidr-exposure"
name = "Netblock exposure"
description = "Passive exposure summary for a small IPv4 block (up to /22): open ports, products, CVEs and hostnames per address from Shodan InternetDB, as a heatmap. Sends nothing to the targets."
version = "0.1.1"
path = "plugins/cidr-exposure"

[[plugin]]
id = "site-fingerprint"
name = "Site fingerprint"
description = "Fingerprint one URL: redirect chain, server and technology hints, security-header scorecard, cookie flags, robots and sitemap, favicon hash and TLS certificate chain."
version = "0.1.1"
path = "plugins/site-fingerprint"

[[plugin]]
id = "sun-shadow"
name = "Sun & shadow check"
description = "Sun azimuth and altitude, shadow length and direction, time of day from a shadow, candidate locations from a shadow (ShadowFinder-style) and a weather cross-check."
version = "0.1.1"
path = "plugins/sun-shadow"

[[plugin]]
id = "osm-query"
name = "OSM feature finder"
description = "Find OpenStreetMap features (towers, bridges, rail crossings, fuel stations, military sites) by radius or box, with raw Overpass QL, geocoding, reverse geocoding and recent edits and notes for an area."
version = "0.1.1"
path = "plugins/osm-query"

[[plugin]]
id = "terrain-view"
name = "Terrain & horizon"
description = "Elevation at a point, elevation profile, line of sight with Earth curvature, horizon silhouette and a visible-from-here map, from decoded Terrarium elevation tiles."
version = "0.1.1"
path = "plugins/terrain-view"

[[plugin]]
id = "place-photos"
name = "Place photos"
description = "Geotagged photos and articles near a coordinate (Wikimedia Commons, Wikipedia) and optional street-level coverage (Mapillary), to compare a claimed location with what is there."
version = "0.1.1"
path = "plugins/place-photos"

[[plugin]]
id = "geo-toolkit"
name = "Coordinates & geodesy"
description = "Convert coordinates between decimal, DMS, UTM, MGRS, geohash, Plus Codes and Maidenhead; geodesic distance, bearing and destination; circle, box and grid generators; GeoJSON clean-up with KML/GPX export; find coordinates in pasted text."
version = "0.1.1"
path = "plugins/geo-toolkit"
