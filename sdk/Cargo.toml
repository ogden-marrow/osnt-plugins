[package]
name = "osnt-common"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Pure-Rust TLS (RustCrypto provider) so plugins cross-compile to the Pi without a C toolchain.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "json"] }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keeps the plugin standalone (not part of any parent workspace) so it builds from its own folder.
[workspace]
